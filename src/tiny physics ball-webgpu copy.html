<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Tiny 3D Physics - WebGPU (Optimized)</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font-family:sans-serif;}
canvas{display:block;margin:auto;}
#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.8);padding:15px;border-radius:8px;border:1px solid #444;}
.row{margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
label{font-size:12px;margin-right:10px;}
input[type="number"]{width:60px;background:#222;color:#fff;border:1px solid #555;padding:2px;}
input[type="range"]{width:100px;}
button{width:100%;margin-top:10px;padding:5px;cursor:pointer;background:#e74c3c;color:#fff;border:none;border-radius:4px;font-weight:bold;}
button:hover{background:#c0392b;}
.note {font-size: 10px; color: #aaa; margin-top: 10px; text-align: center;}
</style>
</head>
<body>
<div id="ui">
    <div class="row"><label>Bounds X (±):</label><input type="number" id="bx" value="10"></div>
    <div class="row"><label>Bounds Y (±):</label><input type="number" id="by" value="10"></div>
    <div class="row"><label>Bounds Z (±):</label><input type="number" id="bz" value="10"></div>
    <div class="row"><label>Active Balls:</label><input type="number" id="ballCount" value="10000"></div>
    <div class="row"><label>Max Buffer:</label><input type="number" id="maxBallsInput" value="32768" disabled></div>
    <div class="row"><label>Camera Dist:</label><input type="range" id="camDist" min="5" max="50" value="15"></div>
    <div class="row"><label>FPS:</label><strong id="fpsDisplay" style="color:#2ecc71;font-size:16px;">0</strong></div>
    <button id="resetBtn">Reset Physics (WebGPU)</button>
    <div class="note">Click canvas to add balls</div>
</div>
<canvas id="c"></canvas>

<script type="module">
// ================= WEBGPU INITIALIZATION =================
const canvas = document.getElementById("c");
canvas.width = 1300;
canvas.height = 1000;

if (!navigator.gpu) {
    alert("WebGPU is not supported by your browser!");
    throw new Error("WebGPU not supported");
}

const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();
const context = canvas.getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format });

// ================= SHADERS (WGSL) =================

const computeWGSL = `
struct Params {
    bounds: vec4<f32>, // xyz 是边界, w 留空对齐
    activeBalls: u32,
    dt: f32,
    pad1: u32,
    pad2: u32,
};

struct Ball {
    pos: vec4<f32>, // x, y, z, radius
    vel: vec4<f32>, // vx, vy, vz, invM
};

@group(0) @binding(0) var<storage, read> ballsIn: array<Ball>;
@group(0) @binding(1) var<storage, read_write> ballsOut: array<Ball>;
@group(0) @binding(2) var<uniform> params: Params;

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) global_id: vec3<u32>) {
    let id = global_id.x;
    if (id >= arrayLength(&ballsIn)) { return; }

    var pos = ballsIn[id].pos;
    var vel = ballsIn[id].vel;

    // 未激活的球体保持原样
    if (id >= params.activeBalls) {
        ballsOut[id].pos = pos;
        ballsOut[id].vel = vel;
        return;
    }

    let r = pos.w;
    let invM = vel.w;
    let dt = params.dt;
    let bounds = params.bounds.xyz;

    vel.y -= 9.0 * dt; // 重力
    pos.x += vel.x * dt;
    pos.y += vel.y * dt;
    pos.z += vel.z * dt;

    // 边界检测
    if (pos.x < -bounds.x + r) { pos.x = -bounds.x + r; vel.x *= -0.8; }
    if (pos.x >  bounds.x - r) { pos.x =  bounds.x - r; vel.x *= -0.8; }
    if (pos.y < -bounds.y + r) { pos.y = -bounds.y + r; vel.y *= -0.8; }
    if (pos.y >  bounds.y - r) { pos.y =  bounds.y - r; vel.y *= -0.8; }
    if (pos.z < -bounds.z + r) { pos.z = -bounds.z + r; vel.z *= -0.8; }
    if (pos.z >  bounds.z - r) { pos.z =  bounds.z - r; vel.z *= -0.8; }

    // O(N^2) 碰撞检测 (由显卡的 Compute Core 并行吞吐)
    for (var i = 0u; i < params.activeBalls; i++) {
        if (i == id) { continue; }
        
        let otherPos = ballsIn[i].pos;
        let otherVel = ballsIn[i].vel;
        
        let dx = otherPos.xyz - pos.xyz;
        let rsum = r + otherPos.w;
        let d2 = dot(dx, dx);
        
        if (d2 > 0.0001 && d2 < rsum * rsum) {
            let dist = sqrt(d2);
            let nx = dx / dist;
            let penetration = rsum - dist;
            let invSum = invM + otherVel.w;
            let corr = penetration * 0.8;
            
            pos.x -= nx.x * corr * (invM / invSum);
            pos.y -= nx.y * corr * (invM / invSum);
            pos.z -= nx.z * corr * (invM / invSum);
            
            let rvx = otherVel.xyz - vel.xyz;
            let relN = dot(rvx, nx);
            if (relN < 0.0) {
                let jimp = -(1.8) * relN / invSum;
                vel.x -= nx.x * jimp * invM;
                vel.y -= nx.y * jimp * invM;
                vel.z -= nx.z * jimp * invM;
            }
        }
    }

    // 写入下一帧的 Buffer
    ballsOut[id].pos = pos;
    ballsOut[id].vel = vel;
}
`;

const renderWGSL = `
struct Camera {
    proj: mat4x4<f32>,
    view: mat4x4<f32>,
};

struct Ball {
    pos: vec4<f32>,
    vel: vec4<f32>,
};

@group(0) @binding(0) var<uniform> camera: Camera;
@group(1) @binding(0) var<storage, read> balls: array<Ball>;

struct VertexOutput {
    @builtin(position) position: vec4<f32>,
    @location(0) normal: vec3<f32>,
    @location(1) color: vec3<f32>,
};

fn hashColor(id: u32) -> vec3<f32> {
    let f = f32(id);
    return fract(sin(vec3<f32>(f*12.9898, f*78.233, f*37.719)) * 43758.5453);
}

@vertex
fn vs_main(@location(0) position: vec3<f32>, 
           @location(1) normal: vec3<f32>, 
           @builtin(instance_index) instanceIdx: u32) -> VertexOutput {
           
    var out: VertexOutput;
    
    // 直接从 Storage Buffer 读取当前球的位置
    let ball = balls[instanceIdx];
    let r = ball.pos.w;
    let worldPos = position * r + ball.pos.xyz;
    
    out.position = camera.proj * camera.view * vec4<f32>(worldPos, 1.0);
    out.normal = normal;
    out.color = hashColor(instanceIdx);
    return out;
}

@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4<f32> {
    let lightDir = normalize(vec3<f32>(0.5, 1.0, 0.3));
    let diff = max(dot(normalize(in.normal), lightDir), 0.0);
    let color = in.color * diff + in.color * 0.2;
    return vec4<f32>(color, 1.0);
}
`;

// ================= GEOMETRY (SPHERE) =================
function createSphere(latBands, longBands){
    const positions=[], normals=[], indices=[];
    for(let lat=0; lat<=latBands; lat++){
        const t = lat*Math.PI/latBands;
        for(let lon=0; lon<=longBands; lon++){
            const p = lon*2*Math.PI/longBands;
            const x = Math.cos(p)*Math.sin(t), y = Math.cos(t), z = Math.sin(p)*Math.sin(t);
            positions.push(x,y,z); normals.push(x,y,z);
        }
    }
    for(let lat=0; lat<latBands; lat++){
        for(let lon=0; lon<longBands; lon++){
            const a = lat*(longBands+1)+lon, b = a+longBands+1;
            indices.push(a,b,a+1, b,b+1,a+1);
        }
    }
    return {positions: new Float32Array(positions), normals: new Float32Array(normals), indices: new Uint16Array(indices)};
}

const sphere = createSphere(16, 16);

function createGPUBuffer(data, usage) {
    const buffer = device.createBuffer({ size: data.byteLength, usage: usage | GPUBufferUsage.COPY_DST, mappedAtCreation: true });
    new data.constructor(buffer.getMappedRange()).set(data);
    buffer.unmap();
    return buffer;
}

const vertexBuffer = createGPUBuffer(sphere.positions, GPUBufferUsage.VERTEX);
const normalBuffer = createGPUBuffer(sphere.normals, GPUBufferUsage.VERTEX);
const indexBuffer = createGPUBuffer(sphere.indices, GPUBufferUsage.INDEX);

// ================= SETUP BUFFERS & PIPELINES =================
const MAX_BALLS = 32768; 
let activeBalls = parseInt(document.getElementById("ballCount").value);

const computeModule = device.createShaderModule({ code: computeWGSL });
const renderModule = device.createShaderModule({ code: renderWGSL });

const computePipeline = device.createComputePipeline({
    layout: 'auto',
    compute: { module: computeModule, entryPoint: 'main' }
});

const renderPipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: {
        module: renderModule, entryPoint: 'vs_main',
        buffers: [
            { arrayStride: 12, attributes: [{ shaderLocation: 0, format: 'float32x3', offset: 0 }] }, // pos
            { arrayStride: 12, attributes: [{ shaderLocation: 1, format: 'float32x3', offset: 0 }] }  // norm
        ]
    },
    fragment: { module: renderModule, entryPoint: 'fs_main', targets: [{ format }] },
    primitive: { topology: 'triangle-list', cullMode: 'back' },
    depthStencil: { depthWriteEnabled: true, depthCompare: 'less', format: 'depth24plus' }
});

// 准备 Ping-Pong Buffer (存放 Ball 结构体: pos(vec4), vel(vec4) = 32 bytes)
const bufferSize = MAX_BALLS * 32;
const bufferA = device.createBuffer({ size: bufferSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
const bufferB = device.createBuffer({ size: bufferSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });

// Uniform Buffers
const computeParamsBuffer = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
const renderCameraBuffer = device.createBuffer({ size: 128, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

// ================= THE FIX: PRE-ALLOCATE BIND GROUPS & ARRAYS =================
// 提前创建好所有的 BindGroup，绝不能在 60FPS 循环里创建！
const computeBGA = device.createBindGroup({ layout: computePipeline.getBindGroupLayout(0), entries: [
    { binding: 0, resource: { buffer: bufferA } },
    { binding: 1, resource: { buffer: bufferB } },
    { binding: 2, resource: { buffer: computeParamsBuffer } }
]});
const computeBGB = device.createBindGroup({ layout: computePipeline.getBindGroupLayout(0), entries: [
    { binding: 0, resource: { buffer: bufferB } },
    { binding: 1, resource: { buffer: bufferA } },
    { binding: 2, resource: { buffer: computeParamsBuffer } }
]});

const renderCameraBindGroup = device.createBindGroup({
    layout: renderPipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: renderCameraBuffer } }]
});

const renderBGA = device.createBindGroup({ layout: renderPipeline.getBindGroupLayout(1), entries: [{ binding: 0, resource: { buffer: bufferB } }] }); 
const renderBGB = device.createBindGroup({ layout: renderPipeline.getBindGroupLayout(1), entries: [{ binding: 0, resource: { buffer: bufferA } }] });

// 提前分配好用于更新矩阵的 TypedArray，避免每帧触发垃圾回收
const projArray = new Float32Array(16);
const viewArray = new Float32Array(16);
const computeParamsData = new ArrayBuffer(32);
const computeParamsF32 = new Float32Array(computeParamsData);
const computeParamsU32 = new Uint32Array(computeParamsData);

const depthTexture = device.createTexture({
    size: [canvas.width, canvas.height, 1],
    format: 'depth24plus',
    usage: GPUTextureUsage.RENDER_ATTACHMENT
});

// ================= INITIALIZATION LOGIC =================
function initPhysics() {
    activeBalls = parseInt(document.getElementById("ballCount").value);
    const bx = parseFloat(document.getElementById("bx").value);
    const by = parseFloat(document.getElementById("by").value);
    const bz = parseFloat(document.getElementById("bz").value);
    
    const initData = new Float32Array(MAX_BALLS * 8); // 8 个 float 对应 vec4 pos, vec4 vel
    for(let i=0; i<MAX_BALLS; i++){
        let r = 0.3;
        initData[i*8+0] = (Math.random()*2-1)*(bx-r); // x
        initData[i*8+1] = (Math.random()*2-1)*(by-r); // y
        initData[i*8+2] = (Math.random()*2-1)*(bz-r); // z
        initData[i*8+3] = r;                          // w (radius)
        initData[i*8+4] = Math.random()*4-2;          // vx
        initData[i*8+5] = Math.random()*4-2;          // vy
        initData[i*8+6] = Math.random()*4-2;          // vz
        initData[i*8+7] = 1 / (r*r);                  // invMass
    }
    device.queue.writeBuffer(bufferA, 0, initData);
    device.queue.writeBuffer(bufferB, 0, initData);
}

document.getElementById("resetBtn").onclick = initPhysics;
canvas.addEventListener("click", () => {
    activeBalls = Math.min(activeBalls + 200, MAX_BALLS);
    document.getElementById("ballCount").value = activeBalls;
});

initPhysics();

// ================= MATH MATRIX =================
function perspectiveWebGPU(fov, aspect, near, far) {
    const f = 1.0 / Math.tan(fov / 2);
    return [ f/aspect, 0, 0, 0,  0, f, 0, 0,  0, 0, far/(near-far), -1,  0, 0, (far*near)/(near-far), 0 ];
}
function lookAt(e,t,u){
    const z=normalize(sub(e,t)), x=normalize(cross(u,z)), y=cross(z,x);
    return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -dot(x,e),-dot(y,e),-dot(z,e),1];
}
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
function normalize(v){const l=Math.hypot(...v);return[v[0]/l,v[1]/l,v[2]/l];}

// ================= MAIN LOOP =================
let frameCount = 0, lastFpsUpdate = 0, step = 0;

function loop(now){
    frameCount++;
    if (now - lastFpsUpdate >= 1000) {
        document.getElementById("fpsDisplay").innerText = frameCount;
        frameCount = 0;
        lastFpsUpdate = now;
    }

    // 更新 Compute Uniforms (原地修改，无 GC 开销)
    computeParamsF32[0] = parseFloat(document.getElementById("bx").value);
    computeParamsF32[1] = parseFloat(document.getElementById("by").value);
    computeParamsF32[2] = parseFloat(document.getElementById("bz").value);
    computeParamsU32[4] = activeBalls; 
    computeParamsF32[5] = 0.016;       // dt
    device.queue.writeBuffer(computeParamsBuffer, 0, computeParamsData);

    // 更新 Render Uniforms (复用数组更新，避免每帧 new Float32Array)
    const dist = parseFloat(document.getElementById("camDist").value);
    projArray.set(perspectiveWebGPU(Math.PI/4, canvas.width/canvas.height, 0.1, 200));
    viewArray.set(lookAt([0, dist * 0.3, dist], [0,0,0], [0,1,0]));
    
    device.queue.writeBuffer(renderCameraBuffer, 0, projArray);
    device.queue.writeBuffer(renderCameraBuffer, 64, viewArray);

    const commandEncoder = device.createCommandEncoder();

    // 1. Compute Pass
    const computePass = commandEncoder.beginComputePass();
    computePass.setPipeline(computePipeline);
    computePass.setBindGroup(0, step % 2 === 0 ? computeBGA : computeBGB);
    
    // 性能优化：不需要派发所有 32768 个球的计算线程，只派发激活的数量
    computePass.dispatchWorkgroups(Math.ceil(activeBalls / 64)); 
    computePass.end();

    // 2. Render Pass
    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            clearValue: { r: 0.05, g: 0.07, b: 0.12, a: 1.0 },
            loadOp: 'clear', storeOp: 'store'
        }],
        depthStencilAttachment: {
            view: depthTexture.createView(),
            depthClearValue: 1.0, depthLoadOp: 'clear', depthStoreOp: 'store'
        }
    });
    
    renderPass.setPipeline(renderPipeline);
    
    // THE FIX: 使用循环外预创建的 BindGroup
    renderPass.setBindGroup(0, renderCameraBindGroup);
    
    renderPass.setBindGroup(1, step % 2 === 0 ? renderBGA : renderBGB);
    renderPass.setVertexBuffer(0, vertexBuffer);
    renderPass.setVertexBuffer(1, normalBuffer);
    renderPass.setIndexBuffer(indexBuffer, 'uint16');
    renderPass.drawIndexed(sphere.indices.length, activeBalls, 0, 0, 0); 
    renderPass.end();

    device.queue.submit([commandEncoder.finish()]);

    step++;
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
