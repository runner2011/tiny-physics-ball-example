<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Tiny 3D Physics - WebGPU</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font-family:sans-serif;}
canvas{display:block;margin:auto;}
#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.8);padding:15px;border-radius:8px;border:1px solid #444;}
.row{margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
label{font-size:12px;margin-right:10px;}
input[type="number"]{width:60px;background:#222;color:#fff;border:1px solid #555;padding:2px;}
input[type="range"]{width:100px;}
button{width:100%;margin-top:10px;padding:5px;cursor:pointer;background:#8e44ad;color:#fff;border:none;border-radius:4px;font-weight:bold;}
button:hover{background:#732d91;}
.note {font-size: 10px; color: #aaa; margin-top: 10px; text-align: center;}
</style>
</head>
<body>
<div id="ui">
    <div class="row"><label>Bounds X (±):</label><input type="number" id="bx" value="10"></div>
    <div class="row"><label>Bounds Y (±):</label><input type="number" id="by" value="10"></div>
    <div class="row"><label>Bounds Z (±):</label><input type="number" id="bz" value="10"></div>
    <div class="row"><label>Active Balls:</label><input type="number" id="ballCount" value="10000"></div>
    <div class="row"><label>Max Buffer:</label><input type="number" id="maxBallsInput" value="32768" disabled></div>
    <div class="row"><label>Camera Dist:</label><input type="range" id="camDist" min="5" max="50" value="15"></div>
    <div class="row"><label>FPS:</label><strong id="fpsDisplay" style="color:#2ecc71;font-size:16px;">0</strong></div>
    <button id="resetBtn">Reset Physics (WebGPU)</button>
    <div class="note">Click canvas to add balls</div>
</div>
<canvas id="c"></canvas>
<script>
async function initWebGPU() {
    if (!navigator.gpu) {
        alert("WebGPU not supported on this browser.");
        return;
    }

    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
        alert("No appropriate WebGPU adapter found.");
        return;
    }
    
    const device = await adapter.requestDevice();

    const canvas = document.getElementById("c");
    canvas.width = 1000;
    canvas.height = 700;
    
    const context = canvas.getContext("webgpu");
    const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
    context.configure({
        device: device,
        format: canvasFormat,
        alphaMode: "premultiplied",
    });

    const MAX_BALLS = 32768;
    document.getElementById("maxBallsInput").value = MAX_BALLS;

    // ================= SHADERS =================
    const computeWGSL = `
        struct ComputeUniforms {
            bounds: vec4<f32>,
            params: vec4<f32>,
        };

        @group(0) @binding(0) var<storage, read> posIn: array<vec4<f32>>;
        @group(0) @binding(1) var<storage, read> velIn: array<vec4<f32>>;
        @group(0) @binding(2) var<storage, read_write> posOut: array<vec4<f32>>;
        @group(0) @binding(3) var<storage, read_write> velOut: array<vec4<f32>>;
        @group(0) @binding(4) var<uniform> uniforms: ComputeUniforms;

        @compute @workgroup_size(256)
        fn main(@builtin(global_invocation_id) global_id: vec3<u32>) {
            let id = global_id.x;
            let activeBalls = u32(uniforms.params.x);
            
            if (id >= arrayLength(&posIn)) {
                return;
            }
            if (id >= activeBalls) {
                posOut[id] = posIn[id];
                velOut[id] = velIn[id];
                return;
            }

            var myPos = posIn[id];
            var myVel = velIn[id];

            let r = myPos.w;
            var pos = myPos.xyz;
            var vel = myVel.xyz;
            let invM = myVel.w;

            let dt = 0.016;
            vel.y -= 9.0 * dt; // Gravity
            pos += vel * dt;

            let bounds = uniforms.bounds.xyz;
            if (pos.x < -bounds.x + r) { pos.x = -bounds.x + r; vel.x *= -0.8; }
            if (pos.x >  bounds.x - r) { pos.x =  bounds.x - r; vel.x *= -0.8; }
            if (pos.y < -bounds.y + r) { pos.y = -bounds.y + r; vel.y *= -0.8; }
            if (pos.y >  bounds.y - r) { pos.y =  bounds.y - r; vel.y *= -0.8; }
            if (pos.z < -bounds.z + r) { pos.z = -bounds.z + r; vel.z *= -0.8; }
            if (pos.z >  bounds.z - r) { pos.z =  bounds.z - r; vel.z *= -0.8; }

            // O(N^2) Collision Checks
            for (var i = 0u; i < activeBalls; i++) {
                if (i == id) { continue; }
                let otherPos = posIn[i];
                let otherVel = velIn[i];

                let dx = otherPos.xyz - pos;
                let rsum = r + otherPos.w;
                let d2 = dot(dx, dx);

                if (d2 > 0.0001 && d2 < rsum * rsum) {
                    let dist = sqrt(d2);
                    let nx = dx / dist;

                    let penetration = rsum - dist;
                    let invSum = invM + otherVel.w;
                    let corr = penetration * 0.8;

                    pos -= nx * corr * (invM / invSum);

                    let rvx = otherVel.xyz - vel;
                    let relN = dot(rvx, nx);
                    if (relN < 0.0) {
                        let jimp = -(1.8) * relN / invSum;
                        vel -= nx * jimp * invM;
                    }
                }
            }

            posOut[id] = vec4<f32>(pos, r);
            velOut[id] = vec4<f32>(vel, invM);
        }
    `;

    const renderWGSL = `
        struct CameraUniforms {
            viewProj: mat4x4<f32>,
        };
        @group(0) @binding(0) var<uniform> camera: CameraUniforms;
        @group(0) @binding(1) var<storage, read> posBuf: array<vec4<f32>>;

        struct VertexInput {
            @location(0) position: vec3<f32>,
            @location(1) normal: vec3<f32>,
        };

        struct VertexOutput {
            @builtin(position) position: vec4<f32>,
            @location(0) normal: vec3<f32>,
            @location(1) color: vec3<f32>,
        };

        fn hashColor(id: u32) -> vec3<f32> {
            let f = f32(id);
            let r = fract(sin(f * 12.9898) * 43758.5453);
            let g = fract(sin(f * 78.233) * 43758.5453);
            let b = fract(sin(f * 37.719) * 43758.5453);
            return vec3<f32>(r, g, b);
        }

        @vertex
        fn vs_main(in: VertexInput, @builtin(instance_index) instanceIdx: u32) -> VertexOutput {
            let pData = posBuf[instanceIdx];
            let pos = pData.xyz;
            let r = pData.w;

            var out: VertexOutput;
            let worldPos = in.position * r + pos;
            out.position = camera.viewProj * vec4<f32>(worldPos, 1.0);
            out.normal = in.normal;
            out.color = hashColor(instanceIdx);
            return out;
        }

        @fragment
        fn fs_main(in: VertexOutput) -> @location(0) vec4<f32> {
            let lightDir = normalize(vec3<f32>(0.5, 1.0, 0.3));
            let diff = max(dot(normalize(in.normal), lightDir), 0.0);
            return vec4<f32>(in.color * diff + in.color * 0.2, 1.0);
        }
    `;

    // ================= PIPELINES =================
    const computeModule = device.createShaderModule({ code: computeWGSL });
    const renderModule = device.createShaderModule({ code: renderWGSL });

    const computePipeline = device.createComputePipeline({
        layout: 'auto',
        compute: {
            module: computeModule,
            entryPoint: 'main',
        },
    });

    const renderPipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: {
            module: renderModule,
            entryPoint: 'vs_main',
            buffers: [
                {
                    arrayStride: 3 * 4,
                    attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }]
                },
                {
                    arrayStride: 3 * 4,
                    attributes: [{ shaderLocation: 1, offset: 0, format: 'float32x3' }]
                }
            ]
        },
        fragment: {
            module: renderModule,
            entryPoint: 'fs_main',
            targets: [{ format: canvasFormat }]
        },
        primitive: {
            topology: 'triangle-list',
            cullMode: 'back',
        },
        depthStencil: {
            depthWriteEnabled: true,
            depthCompare: 'less',
            format: 'depth24plus',
        }
    });

    // ================= SPHERE GEOMETRY =================
    function createSphere(latBands, longBands){
        const positions=[], normals=[], indices=[];
        for(let lat=0; lat<=latBands; lat++){
            const t = lat*Math.PI/latBands;
            for(let lon=0; lon<=longBands; lon++){
                const p = lon*2*Math.PI/longBands;
                const x = Math.cos(p)*Math.sin(t), y = Math.cos(t), z = Math.sin(p)*Math.sin(t);
                positions.push(x,y,z); normals.push(x,y,z);
            }
        }
        for(let lat=0; lat<latBands; lat++){
            for(let lon=0; lon<longBands; lon++){
                const a = lat*(longBands+1)+lon, b = a+longBands+1;
                indices.push(a,b,a+1, b,b+1,a+1);
            }
        }
        return {positions, normals, indices};
    }

    const sphere = createSphere(16, 16);

    const vertexBuf = device.createBuffer({
        size: sphere.positions.length * 4,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
    });
    device.queue.writeBuffer(vertexBuf, 0, new Float32Array(sphere.positions));

    const normalBuf = device.createBuffer({
        size: sphere.normals.length * 4,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
    });
    device.queue.writeBuffer(normalBuf, 0, new Float32Array(sphere.normals));

    const indexBuf = device.createBuffer({
        size: sphere.indices.length * 2,
        usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
    });
    device.queue.writeBuffer(indexBuf, 0, new Uint16Array(sphere.indices));

    const depthTexture = device.createTexture({
        size: [canvas.width, canvas.height],
        format: 'depth24plus',
        usage: GPUTextureUsage.RENDER_ATTACHMENT,
    });

    // ================= BUFFERS & BIND GROUPS =================
    const bufferSize = MAX_BALLS * 16;
    const posBuf0 = device.createBuffer({ size: bufferSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    const velBuf0 = device.createBuffer({ size: bufferSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    const posBuf1 = device.createBuffer({ size: bufferSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    const velBuf1 = device.createBuffer({ size: bufferSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });

    const computeUniformsBuf = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const cameraUniformsBuf = device.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

    const computeBindGroup0 = device.createBindGroup({
        layout: computePipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: { buffer: posBuf0 } },
            { binding: 1, resource: { buffer: velBuf0 } },
            { binding: 2, resource: { buffer: posBuf1 } },
            { binding: 3, resource: { buffer: velBuf1 } },
            { binding: 4, resource: { buffer: computeUniformsBuf } },
        ]
    });

    const computeBindGroup1 = device.createBindGroup({
        layout: computePipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: { buffer: posBuf1 } },
            { binding: 1, resource: { buffer: velBuf1 } },
            { binding: 2, resource: { buffer: posBuf0 } },
            { binding: 3, resource: { buffer: velBuf0 } },
            { binding: 4, resource: { buffer: computeUniformsBuf } },
        ]
    });

    const renderBindGroup0 = device.createBindGroup({
        layout: renderPipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: { buffer: cameraUniformsBuf } },
            { binding: 1, resource: { buffer: posBuf0 } },
        ]
    });

    const renderBindGroup1 = device.createBindGroup({
        layout: renderPipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: { buffer: cameraUniformsBuf } },
            { binding: 1, resource: { buffer: posBuf1 } },
        ]
    });

    let activeBalls = parseInt(document.getElementById("ballCount").value);

    function initPhysics() {
        activeBalls = parseInt(document.getElementById("ballCount").value);
        const bx = parseFloat(document.getElementById("bx").value);
        const by = parseFloat(document.getElementById("by").value);
        const bz = parseFloat(document.getElementById("bz").value);

        const posData = new Float32Array(MAX_BALLS * 4);
        const velData = new Float32Array(MAX_BALLS * 4);

        for(let i=0; i<MAX_BALLS; i++){
            let r = 0.3;
            posData[i*4 + 0] = (Math.random()*2-1)*(bx-r);
            posData[i*4 + 1] = (Math.random()*2-1)*(by-r);
            posData[i*4 + 2] = (Math.random()*2-1)*(bz-r);
            posData[i*4 + 3] = r; 

            velData[i*4 + 0] = Math.random()*4-2;
            velData[i*4 + 1] = Math.random()*4-2;
            velData[i*4 + 2] = Math.random()*4-2;
            velData[i*4 + 3] = 1 / (r*r); 
        }

        device.queue.writeBuffer(posBuf0, 0, posData);
        device.queue.writeBuffer(velBuf0, 0, velData);
        device.queue.writeBuffer(posBuf1, 0, posData);
        device.queue.writeBuffer(velBuf1, 0, velData);
    }

    document.getElementById("resetBtn").onclick = initPhysics;
    canvas.addEventListener("click", () => {
        activeBalls = Math.min(activeBalls + 50, MAX_BALLS);
        document.getElementById("ballCount").value = activeBalls;
    });

    initPhysics();

    // ================= MATH =================
    function multiply(a,b){
        const r=new Float32Array(16);
        for(let i=0;i<4;i++)for(let j=0;j<4;j++){
            let sum=0;for(let k=0;k<4;k++)sum+=a[k*4+j]*b[i*4+k];r[i*4+j]=sum;
        }return r;
    }
    function perspective(fov,aspect,near,far){
        const f=1/Math.tan(fov/2);
        return [f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)/(near-far),-1, 0,0,(2*far*near)/(near-far),0];
    }
    function lookAt(e,t,u){
        const z=normalize(sub(e,t)), x=normalize(cross(u,z)), y=cross(z,x);
        return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -dot(x,e),-dot(y,e),-dot(z,e),1];
    }
    function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
    function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
    function cross(a,b){return[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
    function normalize(v){const l=Math.hypot(...v);return[v[0]/l,v[1]/l,v[2]/l];}

    // ================= RENDER LOOP =================
    let readIdx = 0;
    let frameCount = 0;
    let lastFpsUpdate = performance.now();

    function loop(now) {
        frameCount++;
        if (now - lastFpsUpdate >= 1000) {
            document.getElementById("fpsDisplay").innerText = frameCount;
            frameCount = 0;
            lastFpsUpdate = now;
        }

        const bx = parseFloat(document.getElementById("bx").value);
        const by = parseFloat(document.getElementById("by").value);
        const bz = parseFloat(document.getElementById("bz").value);
        device.queue.writeBuffer(computeUniformsBuf, 0, new Float32Array([
            bx, by, bz, 0,
            activeBalls, 0, 0, 0
        ]));

        const dist = parseFloat(document.getElementById("camDist").value);
        const proj = perspective(Math.PI/4, canvas.width/canvas.height, 0.1, 200);
        const view = lookAt([0, dist * 0.3, dist], [0,0,0], [0,1,0]);
        const viewProj = multiply(proj, view);
        device.queue.writeBuffer(cameraUniformsBuf, 0, new Float32Array(viewProj));

        const commandEncoder = device.createCommandEncoder();

        const computePass = commandEncoder.beginComputePass();
        computePass.setPipeline(computePipeline);
        computePass.setBindGroup(0, readIdx === 0 ? computeBindGroup0 : computeBindGroup1);
        const workgroupCount = Math.ceil(MAX_BALLS / 256);
        computePass.dispatchWorkgroups(workgroupCount);
        computePass.end();

        const textureView = context.getCurrentTexture().createView();
        const renderPassDescriptor = {
            colorAttachments: [{
                view: textureView,
                clearValue: { r: 0.05, g: 0.07, b: 0.12, a: 1.0 },
                loadOp: 'clear',
                storeOp: 'store',
            }],
            depthStencilAttachment: {
                view: depthTexture.createView(),
                depthClearValue: 1.0,
                depthLoadOp: 'clear',
                depthStoreOp: 'store',
            }
        };

        const renderPass = commandEncoder.beginRenderPass(renderPassDescriptor);
        renderPass.setPipeline(renderPipeline);
        
        const writeIdx = 1 - readIdx;
        renderPass.setBindGroup(0, writeIdx === 0 ? renderBindGroup0 : renderBindGroup1);
        renderPass.setVertexBuffer(0, vertexBuf);
        renderPass.setVertexBuffer(1, normalBuf);
        renderPass.setIndexBuffer(indexBuf, 'uint16');
        renderPass.drawIndexed(sphere.indices.length, activeBalls);
        renderPass.end();

        device.queue.submit([commandEncoder.finish()]);

        readIdx = writeIdx;
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
}

initWebGPU();
</script>
</body>
</html>
