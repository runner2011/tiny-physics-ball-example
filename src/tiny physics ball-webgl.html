<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Tiny 3D Physics - WebGL2 UI</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font-family:sans-serif;}
canvas{display:block;margin:auto;}
#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.8);padding:15px;border-radius:8px;border:1px solid #444;}
.row{margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
label{font-size:12px;margin-right:10px;}
input[type="number"]{width:50px;background:#222;color:#fff;border:1px solid #555;padding:2px;}
input[type="range"]{width:100px;}
button{width:100%;margin-top:10px;padding:5px;cursor:pointer;background:#3498db;color:#fff;border:none;border-radius:4px;}
button:hover{background:#2980b9;}
</style>
</head>
<body>
<div id="ui">
    <div class="row"><label>Bounds X (±):</label><input type="number" id="bx" value="5"></div>
    <div class="row"><label>Bounds Y (±):</label><input type="number" id="by" value="5"></div>
    <div class="row"><label>Bounds Z (±):</label><input type="number" id="bz" value="5"></div>
    <div class="row"><label>Initial Balls:</label><input type="number" id="ballCount" value="20"></div>
    <div class="row"><label>Camera Dist:</label><input type="range" id="camDist" min="5" max="50" value="15"></div>
    <div class="row"><label>FPS:</label><span id="fpsDisplay">0</span></div>
    <button id="resetBtn">Reset Simulation</button>
</div>
<canvas id="c"></canvas>
<script>

const canvas = document.getElementById("c");
const bxInput = document.getElementById("bx");
const byInput = document.getElementById("by");
const bzInput = document.getElementById("bz");
const bcInput = document.getElementById("ballCount");
const cdInput = document.getElementById("camDist");
const fpsDisplay = document.getElementById("fpsDisplay");
const resetBtn = document.getElementById("resetBtn");

canvas.width = 1000;
canvas.height = 700;

const gl = canvas.getContext("webgl2");
if(!gl){ alert("WebGL2 required"); }

gl.enable(gl.DEPTH_TEST);
gl.clearColor(0.05,0.07,0.12,1);

// ================= SHADERS =================

const vs = `#version 300 es
precision highp float;

layout(location=0) in vec3 position;
layout(location=1) in vec3 normal;

layout(location=2) in vec3 instancePos;
layout(location=3) in float instanceScale;
layout(location=4) in vec3 instanceColor;

uniform mat4 uProj;
uniform mat4 uView;

out vec3 vNormal;
out vec3 vColor;

void main(){
    vec3 pos = position * instanceScale + instancePos;
    vNormal = normal;
    vColor = instanceColor;
    gl_Position = uProj * uView * vec4(pos,1.0);
}
`;

const fs = `#version 300 es
precision highp float;

in vec3 vNormal;
in vec3 vColor;
out vec4 fragColor;

void main(){
    vec3 lightDir = normalize(vec3(0.5,1.0,0.3));
    float diff = max(dot(normalize(vNormal),lightDir),0.0);
    fragColor = vec4(vColor*diff + vColor*0.2,1.0);
}
`;

function compile(type,src){
    const s=gl.createShader(type);
    gl.shaderSource(s,src);
    gl.compileShader(s);
    return s;
}

const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);
gl.useProgram(prog);

// ================= SPHERE =================

function createSphere(latBands,longBands){
    const positions=[],normals=[],indices=[];
    for(let lat=0;lat<=latBands;lat++){
        const t=lat*Math.PI/latBands;
        const st=Math.sin(t), ct=Math.cos(t);
        for(let lon=0;lon<=longBands;lon++){
            const p=lon*2*Math.PI/longBands;
            const sp=Math.sin(p), cp=Math.cos(p);
            const x=cp*st, y=ct, z=sp*st;
            positions.push(x,y,z);
            normals.push(x,y,z);
        }
    }
    for(let lat=0;lat<latBands;lat++){
        for(let lon=0;lon<longBands;lon++){
            const a=lat*(longBands+1)+lon;
            const b=a+longBands+1;
            indices.push(a,b,a+1,b,b+1,a+1);
        }
    }
    return {positions,normals,indices};
}

const sphere=createSphere(20,20);

const vao=gl.createVertexArray();
gl.bindVertexArray(vao);

function createBuffer(data,loc,size){
    const b=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0);
}

createBuffer(sphere.positions,0,3);
createBuffer(sphere.normals,1,3);

const indexBuf=gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,indexBuf);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(sphere.indices),gl.STATIC_DRAW);

// ================= INSTANCE BUFFER =================

const MAX_BALLS = 1000;
const STRIDE = 7; // x y z scale r g b
const instanceData = new Float32Array(MAX_BALLS * STRIDE);
const instanceBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,instanceBuf);
gl.bufferData(gl.ARRAY_BUFFER,instanceData,gl.DYNAMIC_DRAW);

// position
gl.enableVertexAttribArray(2);
gl.vertexAttribPointer(2,3,gl.FLOAT,false,STRIDE*4,0);
gl.vertexAttribDivisor(2,1);

// scale
gl.enableVertexAttribArray(3);
gl.vertexAttribPointer(3,1,gl.FLOAT,false,STRIDE*4,3*4);
gl.vertexAttribDivisor(3,1);

// color
gl.enableVertexAttribArray(4);
gl.vertexAttribPointer(4,3,gl.FLOAT,false,STRIDE*4,4*4);
gl.vertexAttribDivisor(4,1);

// ================= MATRIX =================

function perspective(fov,aspect,near,far){
    const f=1/Math.tan(fov/2);
    return [
        f/aspect,0,0,0,
        0,f,0,0,
        0,0,(far+near)/(near-far),-1,
        0,0,(2*far*near)/(near-far),0
    ];
}

function lookAt(e,t,u){
    const z=normalize(sub(e,t));
    const x=normalize(cross(u,z));
    const y=cross(z,x);
    return [
        x[0],y[0],z[0],0,
        x[1],y[1],z[1],0,
        x[2],y[2],z[2],0,
        -dot(x,e),-dot(y,e),-dot(z,e),1
    ];
}

function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross(a,b){return[
a[1]*b[2]-a[2]*b[1],
a[2]*b[0]-a[0]*b[2],
a[0]*b[1]-a[1]*b[0]];}
function normalize(v){const l=Math.hypot(...v);return[v[0]/l,v[1]/l,v[2]/l];}

// ================= PHYSICS =================

class Ball{
    constructor(){
        const bx = parseFloat(bxInput.value);
        const by = parseFloat(byInput.value);
        const bz = parseFloat(bzInput.value);
        this.r=0.3;
        this.x=(Math.random()*2-1)*(bx-this.r);
        this.y=(Math.random()*2-1)*(by-this.r);
        this.z=(Math.random()*2-1)*(bz-this.r);
        this.vx=Math.random()*4-2;
        this.vy=Math.random()*4-2;
        this.vz=Math.random()*4-2;
        this.invM=1/(this.r*this.r);
        this.color=[Math.random(),Math.random(),Math.random()];
    }
}

let balls=[];

function spawnBall(){
    if(balls.length<MAX_BALLS)
        balls.push(new Ball());
}

function init() {
    balls = [];
    const count = parseInt(bcInput.value) || 20;
    for(let i=0; i<count; i++) spawnBall();
}

init();
resetBtn.onclick = init;

const gravity=-9;

function step(dt){

    const bx = parseFloat(bxInput.value);
    const by = parseFloat(byInput.value);
    const bz = parseFloat(bzInput.value);

    for(let a of balls){
        a.vy+=gravity*dt;
        a.x+=a.vx*dt;
        a.y+=a.vy*dt;
        a.z+=a.vz*dt;
    }

    // box
    for(let a of balls){
        if(a.x < -bx + a.r){ a.x = -bx + a.r; a.vx *= -0.8; }
        if(a.x >  bx - a.r){ a.x =  bx - a.r; a.vx *= -0.8; }
        if(a.y < -by + a.r){ a.y = -by + a.r; a.vy *= -0.8; }
        if(a.y >  by - a.r){ a.y =  by - a.r; a.vy *= -0.8; }
        if(a.z < -bz + a.r){ a.z = -bz + a.r; a.vz *= -0.8; }
        if(a.z >  bz - a.r){ a.z =  bz - a.r; a.vz *= -0.8; }
    }

    // ball-ball
    for(let i=0;i<balls.length;i++){
        for(let j=i+1;j<balls.length;j++){

            const A=balls[i], B=balls[j];
            let dx=B.x-A.x, dy=B.y-A.y, dz=B.z-A.z;
            let rsum=A.r+B.r;
            let d2=dx*dx+dy*dy+dz*dz;
            if(d2>=rsum*rsum) continue;

            let dist=Math.sqrt(d2)||0.0001;
            let nx=dx/dist, ny=dy/dist, nz=dz/dist;

            let penetration=rsum-dist;
            let invSum=A.invM+B.invM;
            let corr=penetration*0.8;

            A.x-=nx*corr*(A.invM/invSum);
            A.y-=ny*corr*(A.invM/invSum);
            A.z-=nz*corr*(A.invM/invSum);

            B.x+=nx*corr*(B.invM/invSum);
            B.y+=ny*corr*(B.invM/invSum);
            B.z+=nz*corr*(B.invM/invSum);

            let rvx=B.vx-A.vx;
            let rvy=B.vy-A.vy;
            let rvz=B.vz-A.vz;

            let relN=rvx*nx+rvy*ny+rvz*nz;

            if(relN<0){
                let jimp=-(1+0.8)*relN/(invSum);
                A.vx-=nx*jimp*A.invM;
                A.vy-=ny*jimp*A.invM;
                A.vz-=nz*jimp*A.invM;
                B.vx+=nx*jimp*B.invM;
                B.vy+=ny*jimp*B.invM;
                B.vz+=nz*jimp*B.invM;
            }
        }
    }
}

// click spawn
canvas.addEventListener("click",spawnBall);

// ================= LOOP =================

const uProj=gl.getUniformLocation(prog,"uProj");
const uView=gl.getUniformLocation(prog,"uView");

let lastTime = 0;
let frameCount = 0;
let lastFpsUpdate = 0;

function loop(now){

    step(0.016);

    // FPS calculation
    frameCount++;
    if (now - lastFpsUpdate >= 1000) {
        fpsDisplay.innerText = frameCount;
        frameCount = 0;
        lastFpsUpdate = now;
    }

    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

    const dist = parseFloat(cdInput.value);
    const proj=perspective(Math.PI/4,canvas.width/canvas.height,0.1,200);
    const view=lookAt([dist*0.6, dist*0.5, dist*0.6],[0,0,0],[0,1,0]);

    gl.uniformMatrix4fv(uProj,false,new Float32Array(proj));
    gl.uniformMatrix4fv(uView,false,new Float32Array(view));

    for(let i=0;i<balls.length;i++){
        instanceData[i*STRIDE+0]=balls[i].x;
        instanceData[i*STRIDE+1]=balls[i].y;
        instanceData[i*STRIDE+2]=balls[i].z;
        instanceData[i*STRIDE+3]=balls[i].r;
        instanceData[i*STRIDE+4]=balls[i].color[0];
        instanceData[i*STRIDE+5]=balls[i].color[1];
        instanceData[i*STRIDE+6]=balls[i].color[2];
    }

    gl.bindBuffer(gl.ARRAY_BUFFER,instanceBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,instanceData);

    gl.bindVertexArray(vao);

    gl.drawElementsInstanced(
        gl.TRIANGLES,
        sphere.indices.length,
        gl.UNSIGNED_SHORT,
        0,
        balls.length
    );

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
